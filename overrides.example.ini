# Example overrides file.
# Copy it as "overrides.ini" next to ss2ps.exe (or ss2ps.py) to apply it automatically,
# or pass it with --overrides. These values replace the result of the conversion.
# Format: prusaslicer_key = value
# The comment right above a line is copied to the report as the reason.

# Klipper: exclude objects through the firmware
gcode_label_objects = firmware

# 10 mm/s is too slow in PrusaSlicer (applied to every small perimeter)
small_perimeter_speed = 50

# no thick bridges
thick_bridges = 0

# parts were rotated 45 degrees in SuperSlicer, not done in PrusaSlicer: compensate with the infill angle
fill_angle = 45

# same compensation as fill_angle
support_material_angle = 0
