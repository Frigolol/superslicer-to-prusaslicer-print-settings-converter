# Exemple de fichier d'overrides.
# Copie-le en "overrides.ini" a cote de ss2ps.exe (ou ss2ps.py) pour qu'il soit applique automatiquement,
# ou passe-le avec --overrides. Ces valeurs remplacent le resultat de la conversion.
# Format : cle_prusaslicer = valeur
# Le commentaire juste au-dessus d'une ligne est repris comme justification dans le rapport.

# Klipper : exclusion d'objets via le firmware
gcode_label_objects = firmware

# 10 mm/s trop lent chez Prusa (appliqué a tous les petits périmètres)
small_perimeter_speed = 50

# ponts épais non souhaités
thick_bridges = 0

# pièces tournées a 45° dans SuperSlicer, impossible dans Prusa : on compense par l'angle de remplissage
fill_angle = 45

# même compensation que fill_angle
support_material_angle = 0
